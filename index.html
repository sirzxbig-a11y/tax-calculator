<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>税率计算器</title>

<!-- ===== 浏览器标签页图标 favicon ===== -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23818cf8'/><stop offset='100%' stop-color='%234f46e5'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><rect x='16' y='14' width='32' height='36' rx='5' fill='%23ffffff' opacity='0.95'/><rect x='21' y='19' width='22' height='9' rx='2' fill='%23e0e7ff'/><text x='32' y='27.5' font-family='Arial' font-size='10' font-weight='bold' fill='%234f46e5' text-anchor='middle'>%</text><circle cx='24' cy='34' r='2.2' fill='%23c7d2fe'/><circle cx='32' cy='34' r='2.2' fill='%23c7d2fe'/><circle cx='40' cy='34' r='2.2' fill='%23c7d2fe'/><circle cx='24' cy='41' r='2.2' fill='%23c7d2fe'/><circle cx='32' cy='41' r='2.2' fill='%23c7d2fe'/><circle cx='40' cy='41' r='2.2' fill='%23c7d2fe'/></svg>">
  <!-- 浏览器标签页图标（用 SVG，清晰度高） -->
  <link rel="icon" type="image/svg+xml" href="tax-calculator.svg">

  <!-- 手机添加到主屏幕的图标（用 PNG） -->
  <link rel="apple-touch-icon" href="tax-calculator.png">
<style>
  :root{
    --primary:#6366f1;
    --primary-dark:#4f46e5;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#e5e7eb;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:440px;
    background:#fff;
    border-radius:20px;
    padding:28px 26px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,.25);
  }

  /* ===== 标题 + 图标 ===== */
  h1{
    font-size:20px;
    font-weight:600;
    text-align:center;
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  h1 .title-icon{
    width:30px;
    height:30px;
    flex:0 0 auto;
  }

  .subtitle{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin:6px 0 24px;
  }

  .field{ margin-bottom:18px; }

  .field > label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    margin-bottom:8px;
  }

  .input-wrap{ position:relative; }

  .input-wrap input{
    width:100%;
    padding:14px 16px;
    font-size:17px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    font-family:inherit;
    color:var(--text);
    background:#fafafa;
    border:2px solid var(--border);
    border-radius:12px;
    outline:none;
    transition:border-color .18s, box-shadow .18s, background .18s;
    -moz-appearance:textfield;
  }

  .input-wrap input::-webkit-outer-spin-button,
  .input-wrap input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }

  .input-wrap input::placeholder{ color:#c4c9d4; font-weight:400; }

  .input-wrap input:focus{
    border-color:var(--primary);
    background:#fff;
    box-shadow:0 0 0 4px rgba(99,102,241,.13);
  }

  .input-wrap.big input{
    font-size:22px;
    padding:16px 18px;
  }

  .input-wrap.with-prefix input{ padding-left:36px; }
  .input-wrap.with-suffix input{ padding-right:44px; }

  .prefix, .suffix{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-weight:500;
    color:#9ca3af;
    pointer-events:none;
  }
  .prefix{ left:16px; font-size:18px; }
  .suffix{ right:16px; font-size:15px; }

  .segmented{
    display:flex;
    background:#f3f4f6;
    border-radius:11px;
    padding:3px;
    margin-top:10px;
  }

  .segmented button{
    flex:1;
    padding:8px 0;
    font-family:inherit;
    font-size:13px;
    color:var(--muted);
    background:transparent;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:.18s;
  }

  .segmented button.active{
    background:#fff;
    color:var(--primary);
    font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
  }

  .chips{
    display:flex;
    gap:6px;
    margin-top:10px;
  }

  .chip{
    flex:1;
    padding:7px 0;
    font-family:inherit;
    font-size:12.5px;
    color:var(--muted);
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
  }

  .chip:hover{ border-color:var(--primary); color:var(--primary); }

  .chip.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
    font-weight:500;
  }

  .clear-btn{
    width:100%;
    margin-top:2px;
    padding:12px;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    color:var(--muted);
    background:#f9fafb;
    border:1.5px dashed var(--border);
    border-radius:12px;
    cursor:pointer;
    transition:.18s;
  }

  .clear-btn:hover{
    color:#ef4444;
    border-color:#fca5a5;
    background:#fef2f2;
  }

  .clear-btn:active{ transform:scale(.995); }

  button:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

  .results{
    margin-top:20px;
    padding-top:20px;
    border-top:1px dashed var(--border);
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .results-title{
    font-size:12px;
    color:#9ca3af;
    letter-spacing:.5px;
    margin-bottom:2px;
  }

  .result{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:13px 15px;
    border-radius:12px;
    background:#fafafa;
    border:1.5px solid transparent;
    cursor:pointer;
    transition:.15s;
  }

  .result:hover{ background:#f3f4f6; }
  .result:active{ transform:scale(.995); }

  .result.highlight{
    background:#eef2ff;
    border-color:#c7d2fe;
  }

  .r-label{ font-size:13px; color:var(--muted); white-space:nowrap; }

  .r-value{
    font-size:17px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--text);
    margin-left:12px;
    text-align:right;
  }

  .result.highlight .r-label{ color:#4f46e5; font-weight:500; }
  .result.highlight .r-value{ color:var(--primary-dark); font-size:19px; }

  .hint{
    margin-top:14px;
    font-size:11.5px;
    line-height:1.8;
    color:#b0b6c1;
    text-align:center;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:40px;
    transform:translateX(-50%) translateY(10px);
    background:rgba(31,41,55,.92);
    color:#fff;
    font-size:13px;
    padding:9px 20px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:99;
  }

  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="card">
  <!-- ===== 标题 + 内联图标 ===== -->
  <h1>
    <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#818cf8"/>
          <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="14" fill="url(#g)"/>
      <rect x="16" y="14" width="32" height="36" rx="5" fill="#ffffff" opacity="0.95"/>
      <rect x="21" y="19" width="22" height="9" rx="2" fill="#e0e7ff"/>
      <text x="32" y="27.5" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#4f46e5" text-anchor="middle">%</text>
      <circle cx="24" cy="34" r="2.2" fill="#c7d2fe"/>
      <circle cx="32" cy="34" r="2.2" fill="#c7d2fe"/>
      <circle cx="40" cy="34" r="2.2" fill="#c7d2fe"/>
      <circle cx="24" cy="41" r="2.2" fill="#c7d2fe"/>
      <circle cx="32" cy="41" r="2.2" fill="#c7d2fe"/>
      <circle cx="40" cy="41" r="2.2" fill="#c7d2fe"/>
    </svg>
    税率计算器
  </h1>
  <p class="subtitle">填写金额与税点，自动换算税额</p>

  <!-- 实际金额 -->
  <div class="field">
    <label for="amount">实际金额</label>
    <div class="input-wrap big with-prefix">
      <span class="prefix">¥</span>
      <input type="number" id="amount" value="68400" step="0.01"
             inputmode="decimal" placeholder="0.00">
    </div>

    <div class="segmented" id="modeSwitch">
      <button type="button" data-mode="withTax" class="active">这是含税金额</button>
      <button type="button" data-mode="noTax">这是不含税金额</button>
    </div>
  </div>

  <!-- 税率 -->
  <div class="field" style="margin-bottom:14px;">
    <label for="rate">税率（税点）</label>
    <div class="input-wrap with-suffix">
      <input type="number" id="rate" value="6" step="0.01" min="0"
             inputmode="decimal" placeholder="0">
      <span class="suffix">%</span>
    </div>
    <div class="chips">
      <button type="button" class="chip" data-rate="1">1%</button>
      <button type="button" class="chip" data-rate="3">3%</button>
      <button type="button" class="chip active" data-rate="6">6%</button>
      <button type="button" class="chip" data-rate="9">9%</button>
      <button type="button" class="chip" data-rate="13">13%</button>
    </div>
  </div>

  <!-- 清空按钮 -->
  <button type="button" class="clear-btn" id="clearBtn">清空重填</button>

  <!-- 结果 -->
  <div class="results">
    <div class="results-title">计算结果（点击可复制）</div>

    <div class="result highlight">
      <span class="r-label">不含税金额</span>
      <span class="r-value" id="outNoTax">—</span>
    </div>

    <div class="result">
      <span class="r-label">税额</span>
      <span class="r-value" id="outTax">—</span>
    </div>

    <div class="result">
      <span class="r-label">含税金额</span>
      <span class="r-value" id="outWithTax">—</span>
    </div>
  </div>

  <p class="hint">
    不含税金额 = 含税金额 ÷（1 + 税率）　｜　税额 = 不含税金额 × 税率
  </p>
</div>

<div class="toast" id="toast">已复制</div>

<script>
(function () {
  'use strict';

  var amountEl   = document.getElementById('amount');
  var rateEl     = document.getElementById('rate');
  var outNoTax   = document.getElementById('outNoTax');
  var outTax     = document.getElementById('outTax');
  var outWithTax = document.getElementById('outWithTax');
  var modeBtns   = document.querySelectorAll('#modeSwitch button');
  var chips      = document.querySelectorAll('.chip');
  var toast      = document.getElementById('toast');
  var clearBtn   = document.getElementById('clearBtn');

  var mode = 'withTax';

  function money(n) {
    return '¥ ' + n.toLocaleString('zh-CN', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function syncChips() {
    var v = parseFloat(rateEl.value);
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('active', parseFloat(chips[i].dataset.rate) === v);
    }
  }

  function calc() {
    var raw = amountEl.value.trim();
    var amt = parseFloat(raw);
    var ratePct = parseFloat(rateEl.value);
    var r = (!isNaN(ratePct) && ratePct > 0) ? ratePct / 100 : 0;

    if (raw === '' || isNaN(amt)) {
      outNoTax.textContent   = '—';
      outTax.textContent     = '—';
      outWithTax.textContent = '—';
      return;
    }

    var noTax, withTax;

    if (mode === 'withTax') {
      withTax = amt;
      noTax   = (r === 0) ? amt : amt / (1 + r);
    } else {
      noTax   = amt;
      withTax = amt * (1 + r);
    }

    var tax = withTax - noTax;

    outNoTax.textContent   = money(noTax);
    outTax.textContent     = money(tax);
    outWithTax.textContent = money(withTax);
  }

  amountEl.addEventListener('input', calc);
  amountEl.addEventListener('change', calc);

  rateEl.addEventListener('input', function () {
    syncChips();
    calc();
  });

  for (var i = 0; i < modeBtns.length; i++) {
    modeBtns[i].addEventListener('click', function () {
      for (var j = 0; j < modeBtns.length; j++) {
        modeBtns[j].classList.remove('active');
      }
      this.classList.add('active');
      mode = this.dataset.mode;
      calc();
    });
  }

  for (var k = 0; k < chips.length; k++) {
    chips[k].addEventListener('click', function () {
      rateEl.value = this.dataset.rate;
      syncChips();
      calc();
    });
  }

  clearBtn.addEventListener('click', function () {
    amountEl.value = '';
    rateEl.value = '6';
    syncChips();

    mode = 'withTax';
    for (var i = 0; i < modeBtns.length; i++) {
      modeBtns[i].classList.toggle('active', modeBtns[i].dataset.mode === 'withTax');
    }

    calc();
    amountEl.focus();
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      toast.classList.remove('show');
    }, 1400);
  }

  var resultEls = document.querySelectorAll('.result');
  for (var m = 0; m < resultEls.length; m++) {
    resultEls[m].addEventListener('click', function () {
      var txt = this.querySelector('.r-value').textContent;
      if (!txt || txt === '—') return;
      var plain = txt.replace(/[¥,\s]/g, '');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(plain).then(function () {
          showToast('已复制 ' + plain);
        }, function () {
          showToast('复制失败，请手动选择');
        });
      } else {
        showToast('复制失败，请手动选择');
      }
    });
  }

  syncChips();
  calc();
})();
</script>

</body>
</html>
